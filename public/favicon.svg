<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d399"/>
      <stop offset="50%" stop-color="#c9a25d"/>
      <stop offset="100%" stop-color="#9a7536"/>
    </linearGradient>

    <!-- Gold Accent Light Gradient -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7e1b5"/>
      <stop offset="100%" stop-color="#c9a25d"/>
    </linearGradient>

    <!-- Lens Glass Reflection Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2721"/>
      <stop offset="50%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#09090a"/>
    </linearGradient>

    <!-- Inner Reflection Glow -->
    <radialGradient id="lensReflection" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#c9a25d" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#c9a25d" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle for crisp favicon display -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Camera Group -->
  <g transform="translate(0, 8)">

    <!-- Top Viewfinder / Flash Housing Mount (Pentaprism top) -->
    <path d="M196 156 L224 120 H288 L316 156 Z" fill="url(#goldGrad)"/>
    <path d="M208 156 L232 128 H280 L304 156 Z" fill="#141416"/>

    <!-- Shutter Button (Right Top) -->
    <rect x="338" y="132" width="40" height="24" rx="6" fill="url(#goldGrad)"/>

    <!-- Left Dial Top -->
    <rect x="134" y="138" width="32" height="18" rx="4" fill="url(#goldGrad)" opacity="0.8"/>

    <!-- Main Camera Body -->
    <rect x="76" y="156" width="360" height="236" rx="36" fill="#141416" filter="url(#shadow)"/>
    <rect x="76" y="156" width="360" height="236" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>

    <!-- Body Accent Strip / Grip Line -->
    <rect x="96" y="176" width="320" height="10" rx="5" fill="url(#goldGrad)" opacity="0.3"/>

    <!-- Flash / Rangefinder Window (Top Right Body) -->
    <rect x="352" y="196" width="44" height="16" rx="4" fill="url(#goldGrad)"/>
    <circle cx="124" cy="204" r="8" fill="url(#goldGrad)"/>

    <!-- Lens Outer Ring (Gold Metal Bezel) -->
    <circle cx="256" cy="274" r="92" fill="url(#goldGrad)"/>
    <circle cx="256" cy="274" r="84" fill="#0b0b0c"/>
    <circle cx="256" cy="274" r="80" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6"/>

    <!-- Lens Middle Ring -->
    <circle cx="256" cy="274" r="70" fill="url(#lensGrad)"/>
    <circle cx="256" cy="274" r="70" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>

    <!-- Inner Aperture & Glass Reflection -->
    <circle cx="256" cy="274" r="52" fill="#09090a"/>
    <circle cx="256" cy="274" r="52" fill="url(#lensReflection)"/>

    <!-- Lens Reflection Specular Arc -->
    <path d="M224 242 A44 44 0 0 1 280 242" fill="none" stroke="#efede6" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <circle cx="282" cy="294" r="6" fill="url(#goldLight)" opacity="0.7"/>

  </g>
</svg>
