<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Gold Gradient -->
    <linearGradient id="brightGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE89C"/>
      <stop offset="45%" stop-color="#F5C242"/>
      <stop offset="100%" stop-color="#D4941D"/>
    </linearGradient>

    <!-- Top Shutter / Accent Gold -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D1"/>
      <stop offset="100%" stop-color="#F7C853"/>
    </linearGradient>

    <!-- Lens Glass Reflection -->
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2430"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </linearGradient>

    <!-- Glass Reflection Flare -->
    <linearGradient id="<ctrl42>" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79D2FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4A90E2" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Bright Rounded Dark Container for Maximum Tab Contrast -->
  <rect width="512" height="512" rx="100" fill="#141416"/>
  <rect width="492" height="492" x="10" y="10" rx="90" fill="none" stroke="url(#brightGold)" stroke-width="14"/>

  <!-- Camera Body & Pentaprism -->
  <g transform="translate(0, 10)">
    <!-- Pentaprism Top -->
    <path d="M190 145 L225 95 H287 L322 145 Z" fill="url(#brightGold)"/>

    <!-- Shutter Button -->
    <rect x="340" y="110" width="46" height="30" rx="8" fill="url(#goldLight)"/>
    <rect x="126" y="120" width="40" height="22" rx="6" fill="url(#goldLight)"/>

    <!-- Camera Main Body -->
    <rect x="64" y="145" width="384" height="250" rx="44" fill="url(#brightGold)"/>

    <!-- Flash / Viewfinder Window -->
    <rect x="348" y="178" width="56" height="24" rx="6" fill="#FFFFFF"/>
    <circle cx="128" cy="190" r="12" fill="#141416"/>

    <!-- Grip Detail Line -->
    <rect x="88" y="165" width="20" height="210" rx="8" fill="#D4941D" opacity="0.4"/>

    <!-- Lens Outer Ring (Dark contrast ring) -->
    <circle cx="256" cy="270" r="105" fill="#141416"/>
    <circle cx="256" cy="270" r="92" fill="url(#brightGold)"/>

    <!-- Lens Middle Glass Ring -->
    <circle cx="256" cy="270" r="76" fill="url(#lensGlass)"/>
    <circle cx="256" cy="270" r="76" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.3"/>

    <!-- Inner Aperture & Lens Glare -->
    <circle cx="256" cy="270" r="54" fill="#050608"/>
    <circle cx="256" cy="270" r="54" fill="url(#<ctrl42>)"/>

    <!-- Bright Lens Specular Highlight -->
    <ellipse cx="230" cy="244" rx="28" ry="16" transform="rotate(-30 230 244)" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="284" cy="296" r="8" fill="#FFF5D1" opacity="0.9"/>
  </g>
</svg>
